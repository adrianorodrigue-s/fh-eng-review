# Config SQLFluff padrão do time — usada quando a engenharia alvo não tem a
# sua própria (.sqlfluff na raiz do projeto dbt). templater/dialect também já
# vão explícitos por flag de CLI (review/steps.py:_sqlfluff_cmd), então isso
# aqui é sobretudo documentação de fallback.
[sqlfluff]
dialect = bigquery
templater = dbt
max_line_length = 120

# Sem isso, o plugin do templater dbt não sabe onde achar dbt_project.yml/
# profiles.yml quando o projeto-alvo não tem seu próprio .sqlfluff — gera o
# warning "Attempt to set templater to dbt failed" e cai pro jinja puro.
# "." é resolvido a partir do cwd, que review/steps.py:_sqlfluff_cmd já
# garante ser a raiz do projeto dbt (via `cd` antes de rodar o sqlfluff).
[sqlfluff:templater:dbt]
project_dir = .
profiles_dir = .
